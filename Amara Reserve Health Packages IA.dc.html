<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Amara Reserve | Health Packages IA and User Flow</title>
<style>body{margin:0;background:#EEEBE8}a{color:#8A5A2B}a:hover{color:#2C1E11}</style>
</helmet>
<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:20px;padding:24px 16px 48px;box-sizing:border-box;font-family:system-ui,sans-serif">
  <div style="width:100%;max-width:900px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
    <div style="font-size:14px;font-weight:600;color:#2C1E11">{{ title }}</div>
    <a href="{{ src }}" target="_blank" style="font-size:13px;font-weight:600">Open PDF</a>
  </div>
  <sc-if value="{{ loading }}" hint-placeholder-val="{{ true }}"><div style="font-size:13px;color:#72675D;padding:40px">Loading document…</div></sc-if>
  <div ref="{{ pagesRef }}" style="width:100%;max-width:900px;display:flex;flex-direction:column;gap:16px"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { loading: true };
  pagesRef = React.createRef();
  src = './docs/Health Packages IA and User Flow.pdf';
  title = 'Health Packages IA and User Flow';
  async componentDidMount() {
    const pdfjs = await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.min.mjs');
    pdfjs.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.worker.min.mjs';
    const doc = await pdfjs.getDocument(encodeURI(this.src)).promise;
    const host = this.pagesRef.current;
    host.innerHTML = '';
    for (let n = 1; n <= doc.numPages; n++) {
      const page = await doc.getPage(n);
      const vp = page.getViewport({ scale: 2 });
      const c = document.createElement('canvas');
      c.width = vp.width; c.height = vp.height;
      c.style.cssText = 'width:100%;height:auto;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12);border-radius:4px;display:block';
      host.appendChild(c);
      await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
      if (n === 1) this.setState({ loading: false });
    }
  }
  renderVals() {
    return { loading: this.state.loading, pagesRef: this.pagesRef, src: encodeURI(this.src), title: this.title };
  }
}
</script>
</body>
</html>
